        emit('ui:close');
      }
    }
  }, true);

  // Listen for Lua override of the keybind
  on('ui:setKeybind', (p) => {
    if (!p) return;
    const kb = { code: p.code || p.key || '', key: p.key || p.code || '', label: p.label || p.key || p.code || '' };
    saveKeybind(kb);
  });
  on('ui:rebindRequest', () => startKeybindPicker());

  document.getElementById('closeBtn').addEventListener('click', () => {
    document.getElementById('app').classList.remove('open');
    emit('ui:close');
  });

  /* =================================================================
     4) Floating panel primitive (spectator / keybind / custom)
     ================================================================= */
  const floatLayer = document.getElementById('floatLayer');
  const floatPanels = new Map(); // id -> { el, data }

  function ensureFloatPanel(id, { title, top, left, right }) {
    let entry = floatPanels.get(id);
    if (entry) return entry;
    const el = document.createElement('div');
    el.className = 'float-panel';
    el.dataset.id = id;
    el.innerHTML = `
      <div class="float-head" data-drag-handle>
        <span class="fh-dot"></span>
        <span class="fh-title"></span>
      </div>
      <div class="float-body"></div>`;
    el.querySelector('.fh-title').textContent = title || id;
    // Default placement
    if (top != null)   el.style.top = (typeof top === 'number' ? top + 'px' : top);
    if (left != null)  el.style.left = (typeof left === 'number' ? left + 'px' : left);
    if (right != null) el.style.right = (typeof right === 'number' ? right + 'px' : right);
    if (left == null && right == null) {
      // Center top by default
      el.style.left = '50%';
      el.style.transform = 'translateX(-50%)';
    }
    floatLayer.appendChild(el);
    makeDraggable(el, '[data-drag-handle]');
    entry = { el, data: [] };
    floatPanels.set(id, entry);
    return entry;
  }

  function renderFloatPanel(id, rows, opts = {}) {
    const entry = ensureFloatPanel(id, opts);
    rows = rows || [];

    // Update title if changed
    const titleEl = entry.el.querySelector('.fh-title');
    if (opts.title && titleEl.textContent !== opts.title) titleEl.textContent = opts.title;

    // Skip rebuild if rows are identical
    const sig = JSON.stringify(rows);
    if (entry._sig === sig) return;
    entry._sig = sig;
    entry.data = rows;

    const body = entry.el.querySelector('.float-body');
    if (!rows.length) {
      body.innerHTML = `<div class="float-empty">${escapeHtml(opts.emptyText || 'Nothing to show')}</div>`;
      return;
    }
    body.innerHTML = rows.map((r) => `
        <div class="row">
          <span class="row-name">${escapeHtml(r.name || '')}</span>
          ${r.id   ? `<span class="row-id">${escapeHtml(r.id)}</span>` : ''}
          ${r.key  ? `<span class="row-key">${escapeHtml(r.key)}</span>` : ''}
          ${r.action ? `<span class="row-action">${escapeHtml(r.action)}</span>` : ''}
        </div>`).join('');
  }

  function hideFloatPanel(id) {
    const e = floatPanels.get(id);
    if (e) e.el.classList.add('hidden');
  }
  function showFloatPanel(id) {
    const e = floatPanels.get(id);
    if (e) e.el.classList.remove('hidden');
  }
  function destroyFloatPanel(id) {
    const e = floatPanels.get(id);
    if (e) { e.el.remove(); floatPanels.delete(id); }
  }

  // Persisted user preferences for built-in widgets
  const WIDGET_PREFS = 'motion.widgetPrefs';
  let widgetPrefs = {};
  try { widgetPrefs = JSON.parse(localStorage.getItem(WIDGET_PREFS) || '{}'); } catch {}
  function setWidgetPref(id, visible) {
    widgetPrefs[id] = visible;
    try { localStorage.setItem(WIDGET_PREFS, JSON.stringify(widgetPrefs)); } catch {}
    if (visible) showFloatPanel(id); else hideFloatPanel(id);
  }
  function widgetVisible(id) {
    return widgetPrefs[id] !== false; // default ON unless explicitly disabled
  }

  // Lua API for the generic panel
  on('ui:floatPanel', (p) => {
    // p: { id, title, rows, top, left, right, emptyText, hidden, destroy }
    if (!p?.id) return;
    if (p.destroy) { destroyFloatPanel(p.id); return; }
    if (p.hidden)  { hideFloatPanel(p.id); return; }
    renderFloatPanel(p.id, p.rows, p);
    showFloatPanel(p.id);
  });

  // Built-in: spectator list (top-middle, draggable)
  on('ui:spectators', (p) => {
    if (!p) return;
    if (p.hidden) { hideFloatPanel('spectators'); return; }
    const rows = (p.rows || []).map((s) => ({
      name: s.name,
      id: s.id != null ? '#' + s.id : '',
      action: s.distance != null ? Number(s.distance).toFixed(1) + 'm' : '',
    }));
    renderFloatPanel('spectators', rows, {
      title: `Spectators (${rows.length})`,
      top: 16,
      emptyText: 'No one watching',
    });
    if (!widgetVisible('spectators')) hideFloatPanel('spectators');
  });

  // Lua-supplied keybind rows (merged with local ones)
  let luaKeybindRows = [];

  function rebuildKeybindList() {
    const rows = [];
    const main = loadKeybind();
    if (main) rows.push({ name: 'Open / close menu', key: main.label });
    // Item-level binds from menu items
    for (const [id, kb] of Object.entries(itemKeybinds)) {
      // Try to look up the item's label, fall back to id
      const ref = Menu._itemRefs?.get(id);
      const label = ref?.item?.label || id;
      rows.push({ name: label, key: kb.label, id });
    }
    // Append Lua rows
    for (const r of luaKeybindRows) rows.push(r);
    renderFloatPanel('keybinds', rows, {
      title: 'Keybinds',
      top: 16,
      left: 16,
      emptyText: 'No keybinds set',
    });
    if (!widgetVisible('keybinds')) hideFloatPanel('keybinds');
  }

  // Built-in: keybind list (top-left by default)
  on('ui:keybinds', (p) => {
    if (!p) return;
    if (p.hidden) { hideFloatPanel('keybinds'); return; }
    luaKeybindRows = (p.rows || []).map((k) => ({ name: k.name, key: k.key }));
    rebuildKeybindList();
  });

  /* =================================================================
     4b) Item-level keybind capture
     A list of {id -> {code,key,label}} bound to menu items.
     Click the badge on an item to start capture; press a key to bind;
     Esc to cancel.
     ================================================================= */
  const ITEM_KEYBINDS_STORAGE = 'motion.itemKeybinds';
  let itemKeybinds = {};
  try { itemKeybinds = JSON.parse(localStorage.getItem(ITEM_KEYBINDS_STORAGE) || '{}'); } catch {}
  let itemCaptureTarget = null;

  function saveItemKeybinds() {
    try { localStorage.setItem(ITEM_KEYBINDS_STORAGE, JSON.stringify(itemKeybinds)); } catch {}
    try { rebuildKeybindList(); } catch {}
  }
  function startItemCapture(id) {
    itemCaptureTarget = id;
    document.querySelectorAll('.keybind-badge').forEach((b) => b.classList.remove('listening'));
    const item = document.querySelector(`[data-item-id="${CSS.escape(id)}"] .keybind-badge`);
    if (item) { item.classList.add('listening'); item.textContent = 'press a key…'; }
  }
  function stopItemCapture() {
    if (!itemCaptureTarget) return;
    const id = itemCaptureTarget;
    itemCaptureTarget = null;
    document.querySelectorAll('.keybind-badge').forEach((b) => b.classList.remove('listening'));
    // Re-render that item's badge text
    const badge = document.querySelector(`[data-item-id="${CSS.escape(id)}"] .keybind-badge`);
    if (badge) {
      const kb = itemKeybinds[id];
      badge.textContent = kb ? kb.label : '+ key';
    }
  }
  // Listen for keystrokes globally to fire item actions
  document.addEventListener('keydown', (e) => {
    if (overlay.hidden === false || itemCaptureTarget) return;
    // Don't fire item keybinds if user is typing in an input/textarea
    const tag = (e.target?.tagName || '').toUpperCase();
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    for (const [id, kb] of Object.entries(itemKeybinds)) {
      if (kb.code === e.code) {
        emit('ui:itemKeyPressed', { id, key: kb });
        // Also actually trigger the item locally so the user sees the toggle
        const ref = Menu._itemRefs?.get(id);
        if (ref) {
          const t = ref.type;
          if (t === 'checkbox') {
            const input = ref.el.querySelector('input[type="checkbox"]');
            if (input) {
              input.checked = !input.checked;
              input.dispatchEvent(new Event('change', { bubbles: true }));
              // Also pulse a toast so the user knows what happened
              Toast.show({ level: 'info', title: ref.item.label || 'Toggled', message: input.checked ? 'On' : 'Off', duration: 1500 });
            }
          } else if (t === 'button') {
            ref.el.querySelector('.item')?.click();
          }
        }
      }
    }
  });

  /* =================================================================
     Color picker popover (singleton)
     SV square + hue strip + alpha strip + hex + RGBA cells + presets.
     ================================================================= */
  const ColorPicker = (function () {
    // Color math
    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      let h = 0;
      if (d !== 0) {
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
      }
      h = (h * 60 + 360) % 360;
      const s = max === 0 ? 0 : d / max;
      return { h, s, v: max };
    }
    function hsvToRgb(h, s, v) {
      const c = v * s;
      const hp = h / 60;
      const x = c * (1 - Math.abs(hp % 2 - 1));
      let r = 0, g = 0, b = 0;
      if      (0 <= hp && hp < 1) [r, g, b] = [c, x, 0];
      else if (1 <= hp && hp < 2) [r, g, b] = [x, c, 0];
      else if (2 <= hp && hp < 3) [r, g, b] = [0, c, x];
      else if (3 <= hp && hp < 4) [r, g, b] = [0, x, c];
      else if (4 <= hp && hp < 5) [r, g, b] = [x, 0, c];
      else if (5 <= hp && hp < 6) [r, g, b] = [c, 0, x];
      const m = v - c;
      return { r: Math.round((r + m) * 255), g: Math.round((g + m) * 255), b: Math.round((b + m) * 255) };
    }
    function rgbToHex(r, g, b) {
      const h = (n) => n.toString(16).padStart(2, '0');
      return '#' + h(r) + h(g) + h(b);
    }
    function hexToRgb(hex) {
      const m = /^#?([a-f\d]{6})$/i.exec(hex.trim());
      if (!m) return null;
      const n = parseInt(m[1], 16);
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    }

    const popover = document.createElement('div');
    popover.className = 'color-popover';
    popover.hidden = true;
    popover.innerHTML = `
      <div class="cp-row">
        <div class="cp-sv"><div class="cp-sv-thumb"></div></div>
        <div class="cp-hue"><div class="cp-hue-thumb"></div></div>
        <div class="cp-alpha"><div class="cp-alpha-thumb"></div></div>
      </div>
      <div class="cp-preview-row">
        <div class="cp-preview"></div>
        <input class="cp-hex" type="text" maxlength="7" value="#000000" />
      </div>
      <div class="cp-rgba">
        <div class="cp-rgba-cell"><label>R</label><input data-c="r" type="number" min="0" max="255" /></div>
        <div class="cp-rgba-cell"><label>G</label><input data-c="g" type="number" min="0" max="255" /></div>
        <div class="cp-rgba-cell"><label>B</label><input data-c="b" type="number" min="0" max="255" /></div>
        <div class="cp-rgba-cell"><label>A</label><input data-c="a" type="number" min="0" max="100" /></div>
      </div>
      <div class="cp-presets"></div>
    `;
    document.body.appendChild(popover);

    const svBox    = popover.querySelector('.cp-sv');
    const svThumb  = popover.querySelector('.cp-sv-thumb');
    const hueBar   = popover.querySelector('.cp-hue');
    const hueThumb = popover.querySelector('.cp-hue-thumb');
    const alphaBar = popover.querySelector('.cp-alpha');
    const aThumb   = popover.querySelector('.cp-alpha-thumb');
    const previewEl = popover.querySelector('.cp-preview');
    const hexInput  = popover.querySelector('.cp-hex');
    const rgbaInputs = popover.querySelectorAll('.cp-rgba input');
    const presetsEl = popover.querySelector('.cp-presets');

    // State (HSV is the source of truth for the picker UI; RGB is derived)
    let state = { h: 270, s: 1, v: 1, a: 100 };
    let onChange = null;

    function rgba() {
      const { r, g, b } = hsvToRgb(state.h, state.s, state.v);
      return { r, g, b, a: state.a };
    }

    function renderAll() {
      const { r, g, b } = hsvToRgb(state.h, state.s, state.v);
      // SV gradient base color (hue at full saturation/value)
      svBox.style.setProperty('--cp-hue', state.h);
      // Position SV thumb
      svThumb.style.left = (state.s * 100) + '%';
      svThumb.style.top  = ((1 - state.v) * 100) + '%';
      // Hue thumb
      hueThumb.style.top = ((1 - state.h / 360) * 100) + '%';
      // Alpha
      alphaBar.style.setProperty('--cp-alpha-color', `rgb(${r}, ${g}, ${b})`);
      aThumb.style.top = ((1 - state.a / 100) * 100) + '%';
      // Preview
      previewEl.style.setProperty('--cp-preview', `rgba(${r}, ${g}, ${b}, ${state.a / 100})`);
      // Hex
      hexInput.value = rgbToHex(r, g, b).toUpperCase();
      // RGBA inputs
      rgbaInputs.forEach((inp) => {
        const c = inp.dataset.c;
        if (c === 'r') inp.value = r;
        else if (c === 'g') inp.value = g;
        else if (c === 'b') inp.value = b;
        else if (c === 'a') inp.value = state.a;
      });
    }
    function fire() {
      if (!onChange) return;
      onChange(rgba());
    }

    // Drag handlers
    function bindDrag(el, onPos) {
      let dragging = false;
      const update = (e) => {
        const rect = el.getBoundingClientRect();
        const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        const y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
        onPos(x, y);
      };
      el.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        dragging = true;
        update(e);
        e.preventDefault();
      });
      window.addEventListener('mousemove', (e) => { if (dragging) update(e); });
      window.addEventListener('mouseup', () => { dragging = false; });
    }
    bindDrag(svBox,    (x, y) => { state.s = x; state.v = 1 - y; renderAll(); fire(); });
    bindDrag(hueBar,   (_, y) => { state.h = (1 - y) * 360; renderAll(); fire(); });
    bindDrag(alphaBar, (_, y) => { state.a = Math.round((1 - y) * 100); renderAll(); fire(); });

    // Hex input
    hexInput.addEventListener('change', () => {
      const rgb = hexToRgb(hexInput.value);
      if (!rgb) { renderAll(); return; }
      const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
      state.h = hsv.h; state.s = hsv.s; state.v = hsv.v;
      renderAll(); fire();
    });

    // RGBA inputs
    rgbaInputs.forEach((inp) => {
      inp.addEventListener('change', () => {
        const c = inp.dataset.c;
        let v = parseInt(inp.value || '0', 10);
        if (c === 'a') {
          state.a = Math.max(0, Math.min(100, v));
        } else {
          v = Math.max(0, Math.min(255, v));
          const cur = hsvToRgb(state.h, state.s, state.v);
          cur[c] = v;
          const hsv = rgbToHsv(cur.r, cur.g, cur.b);
          state.h = hsv.h; state.s = hsv.s; state.v = hsv.v;
        }
        renderAll(); fire();
      });
    });

    // Presets
    const PRESETS = [
      [168, 85, 247], [244, 63, 94], [16, 185, 129], [245, 158, 11],
      [34, 211, 238], [236, 72, 153], [99, 102, 241], [251, 113, 133],
      [52, 211, 153], [251, 191, 36], [103, 232, 249], [244, 114, 182],
      [255, 255, 255], [10, 10, 14], [80, 80, 90], [200, 200, 210],
    ];
    PRESETS.forEach((c) => {
      const b = document.createElement('button');
      b.className = 'cp-preset';
      b.style.setProperty('--c', `rgb(${c[0]}, ${c[1]}, ${c[2]})`);
      b.addEventListener('click', () => {
        const hsv = rgbToHsv(c[0], c[1], c[2]);
        state.h = hsv.h; state.s = hsv.s; state.v = hsv.v; state.a = 100;
        renderAll(); fire();
      });
      presetsEl.appendChild(b);
    });

    // Click-outside to close
    document.addEventListener('mousedown', (e) => {
      if (popover.hidden) return;
      if (e.target.closest('.color-popover')) return;
      if (e.target.closest('.color-swatch')) return;
      popover.hidden = true;
    });

    return {
      open(anchorEl, initial, cb) {
        const r = initial.r || 0, g = initial.g || 0, b = initial.b || 0;
        const hsv = rgbToHsv(r, g, b);
        state = { h: hsv.h, s: hsv.s, v: hsv.v, a: initial.a == null ? 100 : initial.a };
        onChange = cb;
        renderAll();
        // Position
        const rect = anchorEl.getBoundingClientRect();
        let left = rect.right + 10;
        let top = rect.top - 10;
        if (left + 280 > window.innerWidth)  left = rect.left - 280;
        if (top + 380 > window.innerHeight) top = window.innerHeight - 390;
        if (top < 10) top = 10;
        popover.style.left = left + 'px';
        popover.style.top = top + 'px';
        popover.hidden = false;
      },
      close() { popover.hidden = true; },
    };
  })();



  /* =================================================================
     5) Menu engine (Lua-driven build)

     Spec:
       {
         categories: [
           { id, label, icon, items: [
             { type, id, ... },
             { type: "section", id, label, items: [...] },
             { type: "tabs", id, tabs: [{ id, label, items: [...] }] },
             ...
           ]}
         ]
       }
     Item types: divider, checkbox, slider, button, scrollable, input,
                 select, coords, submenu, section, tabs, custom,
                 colorpicker, textbox
     ================================================================= */

  // Apply a custom accent color (saves + reflects across all UI tinted by --accent)
  function applyCustomAccent(rgb) {
    const r = Math.round(rgb.r), g = Math.round(rgb.g), b = Math.round(rgb.b);
    const glow = `${Math.min(255, r + 40)}, ${Math.min(255, g + 40)}, ${Math.min(255, b + 40)}`;
    document.documentElement.style.setProperty('--accent', `${r}, ${g}, ${b}`);
    document.documentElement.style.setProperty('--accent-glow', glow);
    saveSetting('customAccent', { r, g, b });
    document.getElementById('app').dataset.accent = 'custom';
  }
  function applyCustomBg(rgb) {
    const r = Math.round(rgb.r), g = Math.round(rgb.g), b = Math.round(rgb.b);
    document.documentElement.style.setProperty('--bg-1', `${r}, ${g}, ${b}`);
    document.documentElement.style.setProperty('--bg-2', `${Math.min(255, r + 6)}, ${Math.min(255, g + 4)}, ${Math.min(255, b + 8)}`);
    document.documentElement.style.setProperty('--bg-3', `${Math.min(255, r + 14)}, ${Math.min(255, g + 10)}, ${Math.min(255, b + 18)}`);
    saveSetting('customBg', { r, g, b });
    document.getElementById('app').dataset.theme = 'custom';
  }
  function applyCustomText(rgb) {
    const r = Math.round(rgb.r), g = Math.round(rgb.g), b = Math.round(rgb.b);
    document.documentElement.style.setProperty('--text-1', `${r}, ${g}, ${b}`);
    // Derive softer secondary/tertiary text from the primary
    document.documentElement.style.setProperty('--text-2', `${Math.round(r * .7)}, ${Math.round(g * .7)}, ${Math.round(b * .7)}`);
    document.documentElement.style.setProperty('--text-3', `${Math.round(r * .5)}, ${Math.round(g * .5)}, ${Math.round(b * .5)}`);
    saveSetting('customText', { r, g, b });
  }

  const Menu = {
    _spec: null,
    _activeCat: null,
    _activeTabs: {},      // { tabsId -> selectedTabId }
    _itemRefs: new Map(), // id -> { el, type, item, parentList }

    setMenu(spec) {
      if (!spec || !Array.isArray(spec.categories)) return;
      // Always append Settings as the last category unless the caller opts out.
      const cats = spec.categories.slice();
      if (spec.includeSettings !== false) {
        const settingsCat = defaultMenu().categories[0];
        // Avoid duplicate if caller already added a "settings" category
        if (!cats.some((c) => c.id === 'settings')) cats.push(settingsCat);
      }
      this._spec = { ...spec, categories: cats };
      this._itemRefs.clear();
      this._renderSidebar();
      this.showCategory(cats[0]?.id);
      try { rebuildKeybindList(); } catch {}
    },

    _findCategory(id) {
      return this._spec?.categories.find((c) => c.id === id);
    },

    _renderSidebar() {
      const nav = document.getElementById('categoryNav');
      nav.innerHTML = '';
      this._spec.categories.forEach((c) => {
        const b = document.createElement('button');
        b.className = 'nav-item';
        b.dataset.cat = c.id;
        b.innerHTML = `<span class="nav-dot"></span>${c.icon ? `<i class="${c.icon}"></i>` : ''}<span>${escapeHtml(c.label)}</span>`;
        b.addEventListener('click', () => this.showCategory(c.id));
        nav.appendChild(b);
      });
    },

    showCategory(id) {
      const cat = this._findCategory(id);
      if (!cat) return;
      this._activeCat = id;
      document.querySelectorAll('#categoryNav .nav-item').forEach((n) => n.classList.toggle('active', n.dataset.cat === id));
      document.getElementById('panelTitleText').textContent = cat.label;
      document.getElementById('panelSub').textContent = `${(cat.items || []).length} items`;
      const body = document.getElementById('panelBody');
      body.innerHTML = '';
      (cat.items || []).forEach((item) => body.appendChild(this._renderItem(item, body)));
      emit('ui:tab', { tab: id });
    },

    _renderItem(item, parentList) {
      const t = item.type;
      let el;
      if      (t === 'divider')    el = this._renderDivider(item);
      else if (t === 'section')    el = this._renderSection(item);
      else if (t === 'tabs')       el = this._renderTabs(item);
      else if (t === 'checkbox')   el = this._renderCheckbox(item);
      else if (t === 'slider')     el = this._renderSlider(item);
      else if (t === 'button')     el = this._renderButton(item);
      else if (t === 'scrollable') el = this._renderScrollable(item);
      else if (t === 'input')      el = this._renderInput(item);
      else if (t === 'textbox')    el = this._renderTextBox(item);
      else if (t === 'colorpicker') el = this._renderColorPicker(item);
      else if (t === 'select')     el = this._renderSelect(item);
      else if (t === 'coords')     el = this._renderCoords(item);
      else if (t === 'submenu')    el = this._renderSubmenu(item);
      else if (t === 'custom')     el = this._renderCustom(item);
      else {
        el = document.createElement('div');
        el.className = 'empty';
        el.textContent = `Unknown item type: ${t}`;
      }
      if (item.id) {
        el.setAttribute('data-item-id', item.id);
        this._itemRefs.set(item.id, { el, type: t, item, parentList });
      }
      return el;
    },

    /* ----- renderers ----- */
    _wrapItem(item, innerHtml, extraClass = '') {
      const wrap = document.createElement('div');
      wrap.className = 'item' + (item.hazardous ? ' hazardous' : '') + (extraClass ? ' ' + extraClass : '');
      wrap.innerHTML = `
        ${item.icon ? `<i class="item-icon ${item.icon}"></i>` : ''}
        <span class="item-label">${escapeHtml(item.label || '')}</span>
        ${innerHtml}
        ${item.bindable ? this._keybindBadgeHtml(item.id) : ''}
      `;
      // Wire keybind badge clicks
      if (item.bindable) {
        const badge = wrap.querySelector('.keybind-badge');
        if (badge) {
          badge.addEventListener('click', (e) => {
            e.stopPropagation();
            startItemCapture(item.id);
          });
        }
      }
      return wrap;
    },

    _keybindBadgeHtml(id) {
      const kb = itemKeybinds[id];
      return `<span class="keybind-badge">${kb ? escapeHtml(kb.label) : '+ key'}</span>`;
    },

    _renderDivider(item) {
      const d = document.createElement('div');
      d.className = 'divider';
      d.textContent = item.label || '';
      return d;
    },

    _renderSection(item) {
      const section = document.createElement('div');
      section.className = 'section' + (item.collapsed ? ' collapsed' : '');
      section.innerHTML = `
        <div class="section-head">
          ${escapeHtml(item.label || '')}
          <span class="section-chevron"><i class="fa-solid fa-chevron-down"></i></span>
        </div>
        <div class="section-body"></div>`;
      const body = section.querySelector('.section-body');
      (item.items || []).forEach((child) => body.appendChild(this._renderItem(child, body)));
      section.querySelector('.section-head').addEventListener('click', () => {
        section.classList.toggle('collapsed');
      });
      return section;
    },

    _renderTabs(item) {
      const wrap = document.createElement('div');
      wrap.className = 'tabs-wrap';
      const tabsBar = document.createElement('div');
      tabsBar.className = 'tabs';
      const content = document.createElement('div');
      content.className = 'tab-content';
      const tabs = item.tabs || [];
      const selected = this._activeTabs[item.id] || tabs[0]?.id;
      tabs.forEach((tab) => {
        const tb = document.createElement('button');
        tb.className = 'tab' + (tab.id === selected ? ' active' : '');
        tb.textContent = tab.label || tab.id;
        tb.addEventListener('click', () => {
          this._activeTabs[item.id] = tab.id;
          // Re-render this tabs block in place
          const idx = Array.prototype.indexOf.call(wrap.parentNode.children, wrap);
          const replacement = this._renderTabs(item);
          if (item.id) {
            replacement.setAttribute('data-item-id', item.id);
            this._itemRefs.set(item.id, { el: replacement, type: 'tabs', item, parentList: wrap.parentNode });
          }
          wrap.parentNode.replaceChild(replacement, wrap);
          emit('ui:tabSelect', { id: item.id, tab: tab.id });
        });
        tabsBar.appendChild(tb);
      });
      wrap.appendChild(tabsBar);
      wrap.appendChild(content);
      const activeTab = tabs.find((t) => t.id === selected);
      (activeTab?.items || []).forEach((child) => content.appendChild(this._renderItem(child, content)));
      return wrap;
    },

    _renderCheckbox(item) {
      const wrap = this._wrapItem(item, `
        <label class="switch">
          <input type="checkbox" ${item.checked ? 'checked' : ''} />
          <span class="switch-track"></span>
        </label>`);
      const input = wrap.querySelector('input');
      wrap.addEventListener('click', (e) => {
        if (e.target.closest('.switch') || e.target.closest('.keybind-badge')) return;
        input.checked = !input.checked;
        input.dispatchEvent(new Event('change', { bubbles: true }));
      });
      input.addEventListener('change', () => emit('ui:toggle', { id: item.id, value: input.checked }));
      wrap._setValue = (v) => { input.checked = !!v; };
      return wrap;
    },

    _renderSlider(item) {
      const min = +(item.min ?? 0);
      const max = +(item.max ?? 100);
      const step = +(item.step ?? 1);
      const suffix = item.suffix || '';
      let val = Math.max(min, Math.min(max, +(item.value ?? min)));
      const wrap = this._wrapItem(item, `
        <div class="slider-wrap">
          <div class="slider" tabindex="0">
            <div class="slider-track"><div class="slider-fill"></div></div>
            <div class="slider-thumb"><div class="slider-tooltip"></div></div>
          </div>
          <span class="slider-value"></span>
        </div>`);
      const slider  = wrap.querySelector('.slider');
      const fill    = wrap.querySelector('.slider-fill');
      const thumb   = wrap.querySelector('.slider-thumb');
      const tooltip = wrap.querySelector('.slider-tooltip');
      const valEl   = wrap.querySelector('.slider-value');

      const apply = () => {
        const range = max - min || 1;
        const pct = Math.max(0, Math.min(100, ((val - min) / range) * 100));
        fill.style.width = pct + '%';
        thumb.style.left = pct + '%';
        const display = (Number.isInteger(step) && step >= 1 ? Math.round(val) : (+val).toFixed(2)) + suffix;
        tooltip.textContent = display;
        valEl.textContent = display;
      };
      apply();

      const setFromClientX = (clientX) => {
        const rect = slider.getBoundingClientRect();
        if (rect.width <= 0) return;
        const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        let v = min + pct * (max - min);
        if (step > 0) v = Math.round(v / step) * step;
        v = Math.max(min, Math.min(max, v));
        if (v !== val) {
          val = v;
          apply();
          emit('ui:slider', { id: item.id, value: v });
        }
      };
      let dragging = false;
      slider.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        dragging = true;
        slider.classList.add('dragging');
        setFromClientX(e.clientX);
        e.preventDefault();
      });
      window.addEventListener('mousemove', (e) => { if (dragging) setFromClientX(e.clientX); });
      window.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false; slider.classList.remove('dragging');
      });
      slider.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft')  { val = Math.max(min, val - step); apply(); emit('ui:slider', { id: item.id, value: val }); }
        if (e.key === 'ArrowRight') { val = Math.min(max, val + step); apply(); emit('ui:slider', { id: item.id, value: val }); }
      });

      wrap._setValue = (v) => { val = Math.max(min, Math.min(max, +v)); apply(); };
      return wrap;
    },

    _renderButton(item) {
      const wrap = this._wrapItem(item, `<span class="item-arrow"><i class="fa-solid fa-chevron-right"></i></span>`);
      wrap.addEventListener('click', (e) => {
        if (e.target.closest('.keybind-badge')) return;
        emit('ui:action', { id: item.id });
        if (item.notify !== false) {
          Toast.show({
            level: item.notifyLevel || (item.hazardous ? 'warning' : 'success'),
            title: item.notifyTitle || item.label || 'Action',
            message: item.notifyMessage || 'Action triggered',
          });
        }
      });
      return wrap;
    },

    _renderScrollable(item) {
      const values = item.values || [];
      let idx = Math.max(0, Math.min(values.length - 1, +(item.value ?? 0)));
      const wrap = this._wrapItem(item, `
        <div class="scrollable">
          <button class="scroll-btn" data-dir="-1"><i class="fa-solid fa-angle-left"></i></button>
          <span class="scroll-value">${escapeHtml(values[idx] ?? '')}</span>
          <button class="scroll-btn" data-dir="1"><i class="fa-solid fa-angle-right"></i></button>
        </div>`);
      const valEl = wrap.querySelector('.scroll-value');
      wrap.querySelectorAll('.scroll-btn').forEach((b) => {
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          const dir = parseInt(b.dataset.dir, 10);
          idx = (idx + dir + values.length) % values.length;
          valEl.textContent = values[idx] ?? '';
          emit('ui:scrollable', { id: item.id, index: idx, value: values[idx] });
        });
      });
      wrap._setValue = (v) => {
        const i = typeof v === 'number' ? v : values.indexOf(v);
        if (i >= 0) { idx = i; valEl.textContent = values[idx] ?? ''; }
      };
      return wrap;
    },

    _renderInput(item) {
      const wrap = this._wrapItem(item, `
        <input class="input" type="${item.inputType || 'text'}" placeholder="${escapeHtml(item.placeholder || '')}" value="${escapeHtml(item.value || '')}" style="flex:1; max-width: 260px;" />`);
      const input = wrap.querySelector('input');
      input.addEventListener('change', () => emit('ui:input', { id: item.id, value: input.value }));
      wrap._setValue = (v) => { input.value = v ?? ''; };
      return wrap;
    },

    // MotionMenuTextBox — multi-line textarea variant
    _renderTextBox(item) {
      const rows = item.rows || 3;
      const wrap = document.createElement('div');
      wrap.style.cssText = 'background: linear-gradient(135deg, rgba(var(--bg-3), .5), rgba(var(--bg-2), .3));' +
        'border: 1px solid rgba(var(--border), var(--border-strength));' +
        'border-radius: var(--radius-md); padding: 12px 16px;';
      wrap.innerHTML = `
        ${item.label ? `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
          ${item.icon ? `<i class="item-icon ${item.icon}"></i>` : ''}
          <span class="item-label">${escapeHtml(item.label)}</span>
        </div>` : ''}
        <textarea class="input" rows="${rows}" placeholder="${escapeHtml(item.placeholder || '')}" style="width:100%;resize:vertical;font-family:inherit;">${escapeHtml(item.value || '')}</textarea>
      `;
      const ta = wrap.querySelector('textarea');
      ta.addEventListener('change', () => emit('ui:textbox', { id: item.id, value: ta.value }));
      wrap._setValue = (v) => { ta.value = v ?? ''; };
      return wrap;
    },

    // colorpicker — shows a swatch, click to open picker
    _renderColorPicker(item) {
      const initial = item.value || { r: 168, g: 85, b: 247, a: 100 };
      const wrap = this._wrapItem(item, `<button class="color-swatch" type="button"></button>`);
      const swatch = wrap.querySelector('.color-swatch');
      let cur = { ...initial };
      const apply = () => {
        swatch.style.setProperty('--swatch-bg', `rgba(${cur.r}, ${cur.g}, ${cur.b}, ${(cur.a || 100) / 100})`);
      };
      apply();
      swatch.addEventListener('click', (e) => {
        e.stopPropagation();
        ColorPicker.open(swatch, cur, (next) => {
          cur = next;
          apply();
          emit('ui:color', { id: item.id, value: next });
        });
      });
      wrap._setValue = (v) => {
        if (!v) return;
        cur = { r: v.r || 0, g: v.g || 0, b: v.b || 0, a: v.a == null ? 100 : v.a };
        apply();
      };
      return wrap;
    },

    _renderSelect(item) {
      const opts = item.options || [];
      const val = item.value ?? opts[0];
      const wrap = this._wrapItem(item, `
        <div class="select">
          <select>${opts.map((o) => `<option ${o === val ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('')}</select>
        </div>`);
      const sel = wrap.querySelector('select');
      sel.addEventListener('change', () => emit('ui:select', { id: item.id, value: sel.value }));
      wrap._setValue = (v) => { sel.value = v; };
      return wrap;
    },

    _renderCoords(item) {
      const wrap = document.createElement('div');
      wrap.innerHTML = `
        <div class="divider">${escapeHtml(item.label || 'Coordinates')}</div>
        <div class="coords">
          <label>X<input class="input" type="number" step="0.01" value="${(+(item.x || 0)).toFixed(2)}" data-axis="x"></label>
          <label>Y<input class="input" type="number" step="0.01" value="${(+(item.y || 0)).toFixed(2)}" data-axis="y"></label>
          <label>Z<input class="input" type="number" step="0.01" value="${(+(item.z || 0)).toFixed(2)}" data-axis="z"></label>
          <button class="btn btn-secondary" data-act="copy"><i class="fa-solid fa-copy"></i> Copy</button>
          <button class="btn btn-primary" data-act="apply"><i class="fa-solid fa-paper-plane"></i> Apply</button>
        </div>`;
      const get = () => ({
        x: parseFloat(wrap.querySelector('[data-axis="x"]').value) || 0,
        y: parseFloat(wrap.querySelector('[data-axis="y"]').value) || 0,
        z: parseFloat(wrap.querySelector('[data-axis="z"]').value) || 0,
      });
      wrap.querySelector('[data-act="apply"]').addEventListener('click', () => {
        const c = get();
        emit('ui:coords', { id: item.id, ...c });
        Toast.show({ level: 'success', title: 'Coordinates sent', message: `${c.x}, ${c.y}, ${c.z}` });
      });
      wrap.querySelector('[data-act="copy"]').addEventListener('click', async () => {
        const c = get();
        const txt = `${c.x}, ${c.y}, ${c.z}`;
        try { await navigator.clipboard.writeText(txt); Toast.show({ level: 'info', title: 'Copied', message: txt }); }
        catch { Toast.show({ level: 'warning', title: 'Copy failed', message: 'Clipboard unavailable' }); }
      });
      wrap._setValue = (v) => {
        if (!v) return;
        for (const a of ['x','y','z']) if (v[a] != null) wrap.querySelector(`[data-axis="${a}"]`).value = (+v[a]).toFixed(2);
      };
      return wrap;
    },

    _renderSubmenu(item) {
      const wrap = this._wrapItem(item, `<span class="item-arrow"><i class="fa-solid fa-chevron-right"></i></span>`);
      wrap.addEventListener('click', () => {
        emit('ui:submenu', { id: item.id, target: item.target });
        if (item.target && this._findCategory(item.target)) this.showCategory(item.target);
      });
      return wrap;
    },

    _renderCustom(item) {
      const wrap = document.createElement('div');
      wrap.innerHTML = item.html || '';
      return wrap;
    },

    /* ----- mutate-by-id API ----- */
    setValue(id, value) {
      const ref = this._itemRefs.get(id);
      if (ref && typeof ref.el._setValue === 'function') ref.el._setValue(value);
    },

    addItem(targetCategoryId, item, atIndex) {
      const cat = this._findCategory(targetCategoryId);
      if (!cat) return;
      cat.items = cat.items || [];
      if (atIndex == null) cat.items.push(item); else cat.items.splice(atIndex, 0, item);
      if (this._activeCat === targetCategoryId) this.showCategory(targetCategoryId);
    },

    removeItem(id) {
      // Removal walks the spec tree.
      const walk = (arr) => {
        if (!Array.isArray(arr)) return false;
        const idx = arr.findIndex((it) => it.id === id);
        if (idx >= 0) { arr.splice(idx, 1); return true; }
        for (const it of arr) {
          if (it.items && walk(it.items)) return true;
          if (it.tabs) { for (const t of it.tabs) if (walk(t.items)) return true; }
        }
        return false;
      };
      let removed = false;
      for (const c of (this._spec?.categories || [])) {
        if (walk(c.items)) { removed = true; break; }
      }
      if (removed && this._activeCat) this.showCategory(this._activeCat);
    },

    updateItem(id, patch) {
      const walk = (arr) => {
        if (!Array.isArray(arr)) return null;
        for (const it of arr) {
          if (it.id === id) return it;
          if (it.items) { const r = walk(it.items); if (r) return r; }
          if (it.tabs)  { for (const t of it.tabs) { const r = walk(t.items); if (r) return r; } }
        }
        return null;
      };
      let target = null;
      for (const c of (this._spec?.categories || [])) {
        target = walk(c.items);
        if (target) break;
      }
      if (target) {
        Object.assign(target, patch);
        if (this._activeCat) this.showCategory(this._activeCat);
      }
    },
  };
  window.Menu = Menu;

  // Wire all Lua-driven actions
  on('ui:setMenu',    (p) => Menu.setMenu(p));
  on('ui:setValue',   (p) => Menu.setValue(p?.id, p?.value));
  on('ui:addItem',    (p) => Menu.addItem(p?.category, p?.item, p?.index));
  on('ui:removeItem', (p) => Menu.removeItem(p?.id));
  on('ui:updateItem', (p) => Menu.updateItem(p?.id, p?.patch));
  on('ui:showCategory', (p) => Menu.showCategory(p?.id));

  on('ui:open',  () => document.getElementById('app').classList.add('open'));
  on('ui:close', () => document.getElementById('app').classList.remove('open'));
  on('ui:setTheme', (p) => {
    const app = document.getElementById('app');
    if (p?.theme)  app.dataset.theme  = p.theme;
    if (p?.accent) app.dataset.accent = p.accent;
    if (typeof p?.bgOpacity === 'number') {
      document.documentElement.style.setProperty('--bg-opacity', (p.bgOpacity / 100).toFixed(2));
    }
  });
  on('ui:setUser', (p) => {
    if (p?.name) document.getElementById('userName').textContent = p.name;
    if (p?.sub)  document.getElementById('userSub').textContent  = p.sub;
    if (p?.avatar) {
      const img = document.querySelector('#userAvatar img');
      if (img) img.src = p.avatar;
    }
  });

  /* =================================================================
     Boot
     ================================================================= */
  function boot() {
    // Always start with the Settings-only menu. Lua can replace it with ui:setMenu.
    Menu.setMenu(defaultMenu());

    // Create the built-in floating panels immediately so they're always visible.
    // They show "empty" state until Lua sends data.
    renderFloatPanel('spectators', [], {
      title: 'Spectators',
      top: 16,
      emptyText: 'No spectators',
    });
    renderFloatPanel('keybinds', [], {
      title: 'Keybinds',
      top: 16,
      left: 16,
      emptyText: 'No keybinds',
    });
    // Honor saved visibility prefs
    if (!widgetVisible('spectators')) hideFloatPanel('spectators');
    if (!widgetVisible('keybinds'))   hideFloatPanel('keybinds');

    // Build keybind list from saved main key + item binds
    rebuildKeybindList();

    const kb = loadKeybind();
    if (!kb) {
      startKeybindPicker({ message: 'Press any key — then Enter to save', firstTime: true });
    }
    // Tell Lua we're alive
    emit('ui:ready', { hasKeybind: !!kb, keybind: kb || null });
  }

  // The UI boots with ONLY the Settings category (real UI options).
  // Everything else is sent by Lua via ui:setMenu / ui:addItem.
  function defaultMenu() {
    // Read saved settings
    let savedBgOpacity = 82;
    let savedTheme = 'dark';
    let savedAccent = 'violet';
    let savedCustomAccent = null;
    let savedCustomBg = null;
    let savedCustomText = null;
    try {
      const s = JSON.parse(localStorage.getItem('motion.settings') || '{}');
      if (typeof s.bgOpacity === 'number') savedBgOpacity = s.bgOpacity;
      if (s.theme) savedTheme = s.theme;
      if (s.accent) savedAccent = s.accent;
      if (s.customAccent) savedCustomAccent = s.customAccent;
      if (s.customBg) savedCustomBg = s.customBg;
      if (s.customText) savedCustomText = s.customText;
    } catch {}

    // Apply theme/accent now
    const app = document.getElementById('app');
    if (savedCustomBg) {
      applyCustomBg(savedCustomBg);
    } else {
      app.dataset.theme = savedTheme;
    }
    if (savedCustomAccent) {
      applyCustomAccent(savedCustomAccent);
    } else {
      app.dataset.accent = savedAccent;
    }
    if (savedCustomText) applyCustomText(savedCustomText);
    document.documentElement.style.setProperty('--bg-opacity', (savedBgOpacity / 100).toFixed(2));

    // Current colors as RGB for the swatches
    const accentDefaults = { violet:[168,85,247], crimson:[244,63,94], emerald:[16,185,129], amber:[245,158,11], cyan:[34,211,238], pink:[236,72,153] };
    const bgDefaults = { dark: [10,10,14], light: [248,248,252] };
    const textDefaults = { dark: [245,245,250], light: [24,24,32] };
    const currentAccent = savedCustomAccent || (accentDefaults[savedAccent] && { r: accentDefaults[savedAccent][0], g: accentDefaults[savedAccent][1], b: accentDefaults[savedAccent][2], a: 100 });
    const currentBg = savedCustomBg || (bgDefaults[savedTheme] && { r: bgDefaults[savedTheme][0], g: bgDefaults[savedTheme][1], b: bgDefaults[savedTheme][2], a: 100 });
    const currentText = savedCustomText || (textDefaults[savedTheme] && { r: textDefaults[savedTheme][0], g: textDefaults[savedTheme][1], b: textDefaults[savedTheme][2], a: 100 });

    return {
      categories: [
        {
          id: 'settings', label: 'Settings', icon: 'fa-solid fa-gear',
          items: [
            { type: 'divider', label: 'Appearance' },
            { type: 'colorpicker', id: 'setting_accent_color', label: 'Accent color', icon: 'fa-solid fa-droplet', value: currentAccent },
            { type: 'colorpicker', id: 'setting_bg_color',     label: 'Background color', icon: 'fa-solid fa-palette', value: currentBg },
            { type: 'colorpicker', id: 'setting_text_color',   label: 'Text color', icon: 'fa-solid fa-font', value: currentText },
            { type: 'slider', id: 'setting_bg_opacity', label: 'Background opacity', icon: 'fa-solid fa-window-maximize',
              min: 20, max: 100, value: savedBgOpacity, suffix: '%' },
            { type: 'button', id: 'setting_reset_colors', label: 'Reset colors to default', icon: 'fa-solid fa-rotate-left', notify: false },
            { type: 'divider', label: 'Widgets' },
            { type: 'checkbox', id: 'setting_show_specs', label: 'Show spectator list', icon: 'fa-solid fa-eye',
              checked: widgetVisible('spectators') },
            { type: 'checkbox', id: 'setting_show_keys',  label: 'Show keybind list',   icon: 'fa-solid fa-keyboard',
              checked: widgetVisible('keybinds') },
            { type: 'divider', label: 'Keybind' },
            { type: 'button', id: 'setting_rebind',   label: 'Change menu open key', icon: 'fa-solid fa-pen', notify: false },
            { type: 'button', id: 'setting_clear_kb', label: 'Reset keybind (re-pick)', icon: 'fa-solid fa-rotate-left', notify: false },
          ],
        },
      ],
    };
  }

  // Persist Settings changes
  function saveSetting(key, value) {
    let s = {};
    try { s = JSON.parse(localStorage.getItem('motion.settings') || '{}'); } catch {}
    s[key] = value;
    try { localStorage.setItem('motion.settings', JSON.stringify(s)); } catch {}
  }

  window.addEventListener('motion:color', (e) => {
    const { id, value } = e.detail;
    if (id === 'setting_accent_color') applyCustomAccent(value);
    if (id === 'setting_bg_color')     applyCustomBg(value);
    if (id === 'setting_text_color')   applyCustomText(value);
  });
  window.addEventListener('motion:slider', (e) => {
    if (e.detail.id === 'setting_bg_opacity') {
      document.documentElement.style.setProperty('--bg-opacity', (e.detail.value / 100).toFixed(2));
      saveSetting('bgOpacity', e.detail.value);
    }
  });
  window.addEventListener('motion:toggle', (e) => {
    if (e.detail.id === 'setting_show_specs') setWidgetPref('spectators', e.detail.value);
    if (e.detail.id === 'setting_show_keys')  setWidgetPref('keybinds',   e.detail.value);
  });
  window.addEventListener('motion:action', (e) => {
    const id = e.detail?.id;
    if (id === 'setting_rebind') {
      console.log('[motion] rebind requested');
      startKeybindPicker({ message: 'Press a new key…' });
    } else if (id === 'setting_clear_kb') {
      console.log('[motion] reset keybind requested');
      clearKeybind();
      document.getElementById('app').classList.remove('open');
      // Use a microtask so the click event fully unwinds before showing the picker
      setTimeout(() => {
        startKeybindPicker({ message: 'Press any key — then Enter to save', firstTime: true });
        rebuildKeybindList();
      }, 0);
    } else if (id === 'setting_reset_colors') {
      // Wipe ALL color-related settings from localStorage
      try {
        const s = JSON.parse(localStorage.getItem('motion.settings') || '{}');
        delete s.customAccent; delete s.customBg; delete s.customText;
        delete s.theme; delete s.accent; delete s.bgOpacity;
        localStorage.setItem('motion.settings', JSON.stringify(s));
      } catch {}
      // Clear all inline CSS variable overrides
      const root = document.documentElement;
      ['--accent', '--accent-glow', '--bg-1', '--bg-2', '--bg-3', '--bg-opacity',
       '--text-1', '--text-2', '--text-3'].forEach((v) => root.style.removeProperty(v));
      // Reset dataset to defaults so the [data-theme/accent] CSS rules take over
      const app = document.getElementById('app');
      app.dataset.theme = 'dark';
      app.dataset.accent = 'violet';
      // Rebuild the menu so the swatches reflect the new (default) colors
      Menu.setMenu(defaultMenu());
      Toast.show({ level: 'success', title: 'Colors reset', message: 'Restored defaults' });
    }
  });

  boot();
})();
</script>
</body>
</html>
