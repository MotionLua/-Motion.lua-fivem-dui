<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Motion.lua</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
<style>
  /* =============================================================
     Motion.lua — single-file click-driven NUI for FiveM (Macho DUI)
     ============================================================= */
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --accent: 168, 85, 247;
    --accent-glow: 192, 132, 252;
    --bg-1: 10, 10, 14;
    --bg-2: 16, 14, 22;
    --bg-3: 24, 20, 32;
    --border: 255, 255, 255;
    --border-strength: 0.06;
    --text-1: 245, 245, 250;
    --text-2: 170, 170, 185;
    --text-3: 110, 110, 125;
    --bg-opacity: 0.82;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;

    --ease: cubic-bezier(.2, .8, .2, 1);
    --t-fast: 120ms;
    --t-med: 220ms;
    --t-slow: 360ms;

    --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    --shadow-glow: 0 0 0 1px rgba(var(--accent), .15),
                   0 20px 60px -10px rgba(0,0,0,.6),
                   0 0 80px -10px rgba(var(--accent), .25);
  }

  [data-theme="dark"]  { --bg-1: 10,10,14; --bg-2: 16,14,22; --bg-3: 24,20,32; --border: 255,255,255; --border-strength: .06; --text-1: 245,245,250; --text-2: 170,170,185; --text-3: 110,110,125; }
  [data-theme="light"] { --bg-1: 248,248,252; --bg-2: 255,255,255; --bg-3: 245,243,250; --border: 0,0,0; --border-strength: .07; --text-1: 24,24,32; --text-2: 80,80,95; --text-3: 130,130,145; }

  [data-accent="violet"]  { --accent: 168, 85, 247; --accent-glow: 192, 132, 252; }
  [data-accent="crimson"] { --accent: 244, 63, 94;  --accent-glow: 251, 113, 133; }
  [data-accent="emerald"] { --accent: 16, 185, 129; --accent-glow: 52, 211, 153; }
  [data-accent="amber"]   { --accent: 245, 158, 11; --accent-glow: 251, 191, 36; }
  [data-accent="cyan"]    { --accent: 34, 211, 238; --accent-glow: 103, 232, 249; }
  [data-accent="pink"]    { --accent: 236, 72, 153; --accent-glow: 244, 114, 182; }

  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: var(--font-sans);
    color: rgb(var(--text-1));
    -webkit-font-smoothing: antialiased;
  }
  body {
    background: transparent;
    overflow: hidden;
    height: 100vh;
    user-select: none;
    cursor: none;
  }
  body * { cursor: none !important; }
  button, input, textarea, select { font: inherit; color: inherit; }

  /* ---------- Neon cursor ---------- */
  .neon-cursor {
    position: fixed;
    top: 0; left: 0;
    width: 22px; height: 22px;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-9999px, -9999px) translate(-50%, -50%);
    will-change: transform;
  }
  .neon-cursor::before {
    content: "";
    position: absolute; inset: 6px;
    background: rgb(var(--accent-glow));
    border-radius: 50%;
    box-shadow:
      0 0 6px rgba(var(--accent-glow), 1),
      0 0 14px rgba(var(--accent), .9),
      0 0 28px rgba(var(--accent), .55);
  }
  .neon-cursor::after {
    content: "";
    position: absolute; inset: 0;
    border: 1.5px solid rgba(var(--accent-glow), .8);
    border-radius: 50%;
    box-shadow: 0 0 18px rgba(var(--accent), .65);
    transition: transform var(--t-fast) var(--ease), opacity var(--t-fast) var(--ease);
  }
  .neon-cursor.click::after { transform: scale(0.7); opacity: .6; }
  .neon-cursor.hover::after { transform: scale(1.35); }

  .neon-trail {
    position: fixed;
    top: 0; left: 0;
    width: 6px; height: 6px;
    background: rgba(var(--accent-glow), .9);
    border-radius: 50%;
    pointer-events: none;
    z-index: 99998;
    transform: translate(-50%, -50%);
    mix-blend-mode: screen;
    box-shadow: 0 0 12px rgba(var(--accent), .9);
    animation: trailFade 600ms var(--ease) forwards;
  }
  @keyframes trailFade { to { opacity: 0; transform: translate(-50%, -50%) scale(.2); } }

  /* ---------- Keybind picker (first launch) ---------- */
  .keybind-overlay {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(8px);
    z-index: 9000;
    animation: fadeIn var(--t-med) var(--ease);
  }
  .keybind-overlay[hidden] { display: none; }
  .keybind-card {
    width: 420px;
    padding: 30px 28px;
    background: rgba(var(--bg-2), .96);
    border: 1px solid rgba(var(--accent), .3);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-glow);
    text-align: center;
    animation: rise var(--t-slow) var(--ease);
  }
  .keybind-card .kb-mark {
    width: 56px; height: 56px;
    margin: 0 auto 18px;
    display: grid; place-items: center;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(var(--accent), .35), rgba(var(--accent), .12));
    border: 1px solid rgba(var(--accent), .35);
    color: rgb(var(--accent-glow));
    font-size: 22px;
    box-shadow: 0 0 24px rgba(var(--accent), .5), inset 0 0 16px rgba(var(--accent-glow), .2);
  }
  .keybind-card h2 {
    margin: 0 0 8px;
    font-size: 18px; font-weight: 600;
    letter-spacing: -.01em;
  }
  .keybind-card p {
    margin: 0 0 22px;
    font-size: 13px; line-height: 1.55;
    color: rgb(var(--text-2));
  }
  .keybind-display {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 22px;
    min-width: 220px;
    background: rgba(var(--accent), .1);
    border: 1.5px dashed rgba(var(--accent), .5);
    border-radius: var(--radius-md);
    color: rgb(var(--accent-glow));
    font-family: var(--font-mono);
    font-size: 14px; font-weight: 500;
    margin-bottom: 18px;
    transition: all var(--t-fast) var(--ease);
  }
  .keybind-display.captured {
    border-style: solid;
    background: rgba(var(--accent), .18);
    box-shadow: 0 0 18px rgba(var(--accent), .35);
  }
  .keybind-display .kb-blink {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgb(var(--accent));
    box-shadow: 0 0 10px rgb(var(--accent));
    animation: blink 1s ease-in-out infinite;
  }
  .keybind-display.captured .kb-blink {
    animation: none;
    background: rgb(16, 185, 129);
    box-shadow: 0 0 10px rgb(16, 185, 129);
  }
  @keyframes blink { 50% { opacity: .25; } }
  .keybind-hint {
    margin-top: 6px;
    font-size: 11px;
    color: rgb(var(--text-3));
  }

  /* ---------- App ---------- */
  .app {
    position: fixed; inset: 0;
    display: none;
    pointer-events: none;
    z-index: 10;
  }
  .app.open { display: block; pointer-events: auto; }

  .window {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    box-shadow: var(--shadow-glow);
    border-radius: var(--radius-xl);
  }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, calc(-50% + 12px)); } to { opacity: 1; transform: translate(-50%, -50%); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 230px; height: 640px;
    background:
      linear-gradient(180deg, rgba(var(--accent), .04), rgba(var(--accent), 0) 200px),
      rgba(var(--bg-2), var(--bg-opacity));
    border: 1px solid rgba(var(--border), var(--border-strength));
    border-right: none;
    border-radius: var(--radius-xl) 0 0 var(--radius-xl);
    display: flex; flex-direction: column;
    padding: 22px 14px 14px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    position: relative;
    overflow: hidden;
  }
  .sidebar::before {
    content: "";
    position: absolute;
    top: -40%; left: -30%;
    width: 200%; height: 60%;
    background: radial-gradient(closest-side, rgba(var(--accent), .12), transparent 70%);
    pointer-events: none;
  }

  .brand {
    display: flex; align-items: center; gap: 11px;
    padding: 4px 8px 24px;
    position: relative;
  }
  .brand-mark {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border-radius: 10px;
    border: 1px solid rgba(var(--accent), .35);
    box-shadow: 0 0 12px rgba(var(--accent), .35), inset 0 0 12px rgba(var(--accent-glow), .15);
    overflow: hidden;
    background: linear-gradient(135deg, rgba(var(--accent), .35), rgba(var(--accent), .12));
  }
  .brand-mark img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .brand-name {
    font-weight: 600;
    letter-spacing: -0.015em;
    font-size: 16px;
    background: linear-gradient(135deg, rgb(var(--text-1)) 30%, rgba(var(--accent-glow), .9));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand-name .dot { color: rgb(var(--accent)); -webkit-text-fill-color: rgb(var(--accent)); }

  .nav { display: flex; flex-direction: column; gap: 3px; flex: 1; position: relative; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    width: 100%; padding: 10px 12px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-md);
    color: rgb(var(--text-2));
    font-size: 13px; font-weight: 500;
    text-align: left;
    transition: background var(--t-fast) var(--ease),
                color var(--t-fast) var(--ease),
                border-color var(--t-fast) var(--ease);
    position: relative;
  }
  .nav-item:hover { background: rgba(var(--border), .04); color: rgb(var(--text-1)); }
  .nav-item.active {
    background: linear-gradient(90deg, rgba(var(--accent), .18), rgba(var(--accent), .06));
    color: rgb(var(--text-1));
    border-color: rgba(var(--accent), .28);
    box-shadow: inset 0 0 12px rgba(var(--accent), .08);
  }
  .nav-item.active::before {
    content: "";
    position: absolute;
    left: -14px; top: 50%;
    transform: translateY(-50%);
    width: 3px; height: 18px;
    background: rgb(var(--accent));
    border-radius: 0 2px 2px 0;
    box-shadow: 0 0 12px rgb(var(--accent));
  }
  .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .5; }
  .nav-item.active .nav-dot { background: rgb(var(--accent)); opacity: 1; box-shadow: 0 0 10px rgb(var(--accent)); }

  .sidebar-footer {
    padding-top: 14px;
    border-top: 1px solid rgba(var(--border), var(--border-strength));
    position: relative;
  }
  .user { display: flex; align-items: center; gap: 10px; padding: 6px 8px; }
  .user-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: grid; place-items: center;
    border: 1.5px solid rgba(var(--accent), .5);
    box-shadow: 0 0 12px rgba(var(--accent), .3);
    overflow: hidden;
    background: linear-gradient(135deg, rgba(var(--accent), .3), rgba(var(--accent), .1));
  }
  .user-avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .user-name { font-size: 13px; font-weight: 500; }
  .user-sub { font-size: 11px; color: rgb(var(--text-3)); display: flex; align-items: center; gap: 4px; }
  .user-sub::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgb(16, 185, 129);
    box-shadow: 0 0 8px rgb(16, 185, 129);
  }

  /* ---------- Panel ---------- */
  .panel {
    width: 860px; height: 640px;
    background:
      radial-gradient(circle at 100% 0%, rgba(var(--accent), .08), transparent 40%),
      rgba(var(--bg-1), var(--bg-opacity));
    border: 1px solid rgba(var(--border), var(--border-strength));
    border-radius: 0 var(--radius-xl) var(--radius-xl) 0;
    display: flex; flex-direction: column;
    overflow: hidden;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    position: relative;
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px;
    border-bottom: 1px solid rgba(var(--border), var(--border-strength));
    position: relative;
  }
  .panel-header::after {
    content: "";
    position: absolute;
    left: 22px; right: 22px; bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(var(--accent), .35), transparent);
  }
  .panel-title { font-size: 14px; font-weight: 600; color: rgb(var(--text-1)); display: flex; align-items: center; gap: 10px; }
  .panel-title .pt-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgb(var(--accent));
    box-shadow: 0 0 10px rgb(var(--accent));
  }
  .panel-title .pt-sub { color: rgb(var(--text-3)); font-weight: 400; font-size: 12px; font-family: var(--font-mono); }

  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    background: rgba(var(--border), .04);
    border: 1px solid rgba(var(--border), var(--border-strength));
    border-radius: 8px;
    color: rgb(var(--text-2));
    font-size: 12px;
    transition: all var(--t-fast) var(--ease);
  }
  .icon-btn:hover {
    background: rgba(var(--accent), .15);
    color: rgb(var(--accent-glow));
    border-color: rgba(var(--accent), .35);
    box-shadow: 0 0 14px rgba(var(--accent), .3);
  }

  .panel-body { flex: 1; overflow-y: auto; padding: 20px; }
  .panel-body::-webkit-scrollbar { width: 8px; }
  .panel-body::-webkit-scrollbar-track { background: transparent; }
  .panel-body::-webkit-scrollbar-thumb { background: rgba(var(--accent), .25); border-radius: 4px; }
  .panel-body::-webkit-scrollbar-thumb:hover { background: rgba(var(--accent), .4); }

  /* ---------- Section (collapsible group) ---------- */
  .section {
    margin-bottom: 14px;
    background: rgba(var(--bg-2), .35);
    border: 1px solid rgba(var(--border), var(--border-strength));
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .section-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(var(--border), var(--border-strength));
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgb(var(--text-2));
    transition: background var(--t-fast) var(--ease);
  }
  .section-head::before {
    content: "";
    width: 4px; height: 4px;
    background: rgb(var(--accent));
    border-radius: 50%;
    box-shadow: 0 0 8px rgb(var(--accent));
  }
  .section-head:hover { background: rgba(var(--accent), .05); }
  .section-chevron { margin-left: auto; font-size: 9px; color: rgb(var(--text-3)); transition: transform var(--t-fast) var(--ease); }
  .section.collapsed .section-chevron { transform: rotate(-90deg); }
  .section-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .section.collapsed .section-body { display: none; }

  /* ---------- Items ---------- */
  .items { display: flex; flex-direction: column; gap: 6px; }
  .item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px;
    background: linear-gradient(135deg, rgba(var(--bg-3), .5), rgba(var(--bg-2), .3));
    border: 1px solid rgba(var(--border), var(--border-strength));
    border-radius: var(--radius-md);
    transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
    position: relative;
    overflow: hidden;
  }
  .item::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: rgb(var(--accent));
    opacity: 0;
    transition: opacity var(--t-fast) var(--ease);
  }
  .item:hover {
    background: linear-gradient(135deg, rgba(var(--bg-3), .8), rgba(var(--bg-2), .5));
    border-color: rgba(var(--accent), .25);
  }
  .item:hover::before { opacity: 1; }
  .item.hazardous .item-label::after { content: " ⚠"; color: #fcb603; }

  .item-icon {
    width: 22px; flex-shrink: 0;
    display: grid; place-items: center;
    color: rgb(var(--accent-glow));
    font-size: 13px;
    text-shadow: 0 0 12px rgba(var(--accent), .6);
  }
  .item-label { flex: 1; font-size: 13px; color: rgb(var(--text-1)); font-weight: 500; }
  .item-value { font-size: 12px; color: rgb(var(--text-2)); font-family: var(--font-mono); }
  .item-arrow { color: rgb(var(--text-3)); font-size: 11px; transition: transform var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .item:hover .item-arrow { color: rgb(var(--accent-glow)); transform: translateX(3px); }

  /* Inline keybind badge for items that have a key bound */
  .keybind-badge {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 2px 8px; font-size: 10px; font-family: var(--font-mono);
    background: rgba(var(--accent), .15); color: rgb(var(--accent-glow));
    border: 1px solid rgba(var(--accent), .35);
    border-radius: 4px;
    margin-left: 6px; white-space: nowrap;
  }
  .keybind-badge.listening {
    background: rgba(var(--accent), .35);
    color: #fff;
    border-color: rgba(var(--accent), .7);
    animation: blink 1s ease-in-out infinite;
  }

  .divider {
    padding: 18px 4px 8px;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgb(var(--text-3));
    display: flex; align-items: center; gap: 10px;
  }
  .divider::before {
    content: "";
    width: 4px; height: 4px;
    background: rgb(var(--accent));
    border-radius: 50%;
    box-shadow: 0 0 8px rgb(var(--accent));
  }
  .divider::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, rgba(var(--border), var(--border-strength)), transparent);
  }

  /* ---------- Tabs (in-panel) ---------- */
  .tabs {
    display: flex; gap: 4px;
    margin-bottom: 16px;
    padding: 4px;
    background: rgba(var(--bg-2), .5);
    border: 1px solid rgba(var(--border), var(--border-strength));
    border-radius: var(--radius-md);
    width: fit-content;
  }
  .tab {
    padding: 7px 14px;
    font-size: 12px; font-weight: 500;
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    color: rgb(var(--text-2));
    transition: all var(--t-fast) var(--ease);
  }
  .tab:hover { color: rgb(var(--text-1)); }
  .tab.active {
    background: rgba(var(--accent), .2);
    color: rgb(var(--accent-glow));
    box-shadow: 0 0 10px rgba(var(--accent), .25);
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 9px 16px;
    font-size: 13px; font-weight: 500;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    transition: all var(--t-fast) var(--ease);
    position: relative;
    overflow: hidden;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: linear-gradient(135deg, rgb(var(--accent)), rgba(var(--accent), .85));
    color: white;
    box-shadow: 0 4px 14px rgba(var(--accent), .35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .btn-primary:hover { box-shadow: 0 6px 20px rgba(var(--accent), .5), inset 0 1px 0 rgba(255,255,255,.2); }
  .btn-secondary { background: rgba(var(--accent), .12); color: rgb(var(--accent-glow)); border-color: rgba(var(--accent), .3); }
  .btn-secondary:hover { background: rgba(var(--accent), .2); border-color: rgba(var(--accent), .5); box-shadow: 0 0 14px rgba(var(--accent), .25); }
  .btn-ghost { background: transparent; color: rgb(var(--text-2)); border-color: rgba(var(--border), var(--border-strength)); }
  .btn-ghost:hover { color: rgb(var(--text-1)); background: rgba(var(--border), .04); }
  .btn-danger { background: rgba(244, 63, 94, .12); color: rgb(244, 63, 94); border-color: rgba(244, 63, 94, .3); }
  .btn-danger:hover { background: rgba(244, 63, 94, .2); }

  /* ---------- Switch ---------- */
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-track {
    position: absolute; inset: 0;
    background: rgba(var(--border), .12);
    border: 1px solid rgba(var(--border), var(--border-strength));
    border-radius: 999px;
    transition: all var(--t-med) var(--ease);
  }
  .switch-track::before {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    background: linear-gradient(135deg, #fff, #d4d4dc);
    border-radius: 50%;
    transition: transform var(--t-med) var(--ease), box-shadow var(--t-med) var(--ease);
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .switch input:checked + .switch-track {
    background: linear-gradient(135deg, rgba(var(--accent), .9), rgba(var(--accent), .7));
    border-color: rgba(var(--accent), .5);
    box-shadow: 0 0 14px rgba(var(--accent), .5), inset 0 0 8px rgba(var(--accent-glow), .3);
  }
  .switch input:checked + .switch-track::before {
    transform: translateX(18px);
    box-shadow: 0 1px 3px rgba(0,0,0,.4), 0 0 10px rgba(var(--accent-glow), .6);
  }

  /* ---------- Slider ---------- */
  .slider-wrap { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 200px; }
  .slider { flex: 1; height: 28px; position: relative; display: flex; align-items: center; }
  .slider-track {
    position: absolute; left: 0; right: 0;
    height: 6px;
    background: rgba(var(--border), .08);
    border: 1px solid rgba(var(--border), var(--border-strength));
    border-radius: 4px;
    overflow: hidden;
  }
  .slider-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, rgba(var(--accent), .6), rgb(var(--accent-glow)));
    border-radius: 3px;
    box-shadow: 0 0 14px rgba(var(--accent), .55);
    transition: width var(--t-fast) linear;
  }
  .slider-thumb {
    position: absolute; top: 50%;
    transform: translate(-50%, -50%);
    width: 16px; height: 16px;
    background: white;
    border-radius: 50%;
    border: 2px solid rgb(var(--accent-glow));
    box-shadow: 0 0 0 4px rgba(var(--accent), .15), 0 0 14px rgba(var(--accent), .8);
    transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
  }
  .slider:hover .slider-thumb, .slider.dragging .slider-thumb {
    transform: translate(-50%, -50%) scale(1.2);
    box-shadow: 0 0 0 6px rgba(var(--accent), .2), 0 0 22px rgba(var(--accent), 1);
  }
  .slider-tooltip {
    position: absolute; top: -28px; left: 50%;
    transform: translateX(-50%);
    padding: 3px 8px;
    background: rgb(var(--accent));
    color: white;
    font-size: 11px; font-family: var(--font-mono); font-weight: 500;
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity var(--t-fast) var(--ease);
    box-shadow: 0 4px 12px rgba(var(--accent), .4);
    pointer-events: none;
  }
  .slider-tooltip::after {
    content: "";
    position: absolute;
    bottom: -4px; left: 50%;
    transform: translateX(-50%);
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 4px solid rgb(var(--accent));
  }
  .slider:hover .slider-tooltip, .slider.dragging .slider-tooltip { opacity: 1; }
  .slider-value {
    min-width: 50px; text-align: right;
    font-size: 12px; font-family: var(--font-mono);
    color: rgb(var(--accent-glow));
    text-shadow: 0 0 10px rgba(var(--accent), .5);
  }

  /* ---------- Scrollable ---------- */
  .scrollable {
    display: flex; align-items: center; gap: 6px;
    background: rgba(var(--bg-3), .5);
    border: 1px solid rgba(var(--border), var(--border-strength));
    border-radius: 8px;
    padding: 2px;
  }
  .scroll-btn {
    width: 24px; height: 24px;
    display: grid; place-items: center;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: rgb(var(--text-2));
    transition: all var(--t-fast) var(--ease);
  }
  .scroll-btn:hover { background: rgba(var(--accent), .2); color: rgb(var(--accent-glow)); }
  .scroll-value {
    min-width: 80px; text-align: center;
    font-size: 12px; font-family: var(--font-mono); font-weight: 500;
    color: rgb(var(--text-1));
    padding: 0 6px;
  }

  /* ---------- Input ---------- */
  .input {
    width: 100%;
    padding: 9px 14px;
    font-size: 13px; font-family: inherit;
    background: rgba(var(--bg-3), .6);
    border: 1px solid rgba(var(--border), var(--border-strength));
    border-radius: var(--radius-md);
    color: rgb(var(--text-1));
    transition: all var(--t-fast) var(--ease);
  }
  .input:focus {
    outline: none;
    border-color: rgba(var(--accent), .6);
    background: rgba(var(--bg-3), .85);
    box-shadow: 0 0 0 3px rgba(var(--accent), .12), 0 0 14px rgba(var(--accent), .2);
  }
  .input::placeholder { color: rgb(var(--text-3)); }

  /* ---------- Color picker ---------- */
  .color-swatch {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 2px solid rgba(var(--border), .15);
    background-color: #fff;
    background-image:
      linear-gradient(var(--swatch-bg, rgb(var(--accent))), var(--swatch-bg, rgb(var(--accent)))),
      conic-gradient(rgba(0,0,0,.15) 0% 25%, transparent 0% 50%, rgba(0,0,0,.15) 0% 75%, transparent 0%);
    background-size: 100% 100%, 8px 8px;
    flex-shrink: 0;
    transition: transform var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
    box-shadow: 0 0 8px var(--swatch-bg, rgba(var(--accent), .4));
  }
  .color-swatch:hover { transform: scale(1.1); border-color: rgba(var(--border), .3); }
  .color-popover {
    position: fixed;
    width: 260px;
    padding: 14px;
    background: rgba(var(--bg-2), .98);
    border: 1px solid rgba(var(--accent), .25);
    border-radius: var(--radius-md);
    box-shadow: 0 10px 30px rgba(0,0,0,.6), 0 0 24px rgba(var(--accent), .2);
    z-index: 800;
  }
  .color-popover[hidden] { display: none; }
  .cp-row { display: flex; gap: 8px; }
  .cp-sv {
    position: relative;
    flex: 1;
    height: 180px;
    border-radius: 4px;
    cursor: crosshair;
    background:
      linear-gradient(to top, #000, transparent),
      linear-gradient(to right, #fff, transparent),
      hsl(var(--cp-hue, 270), 100%, 50%);
    overflow: hidden;
  }
  .cp-sv-thumb {
    position: absolute;
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px solid #fff;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 0 6px rgba(0,0,0,.5);
    pointer-events: none;
  }
  .cp-hue, .cp-alpha {
    position: relative;
    width: 14px;
    height: 180px;
    border-radius: 4px;
    cursor: pointer;
  }
  .cp-hue {
    background: linear-gradient(to top, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%);
  }
  .cp-alpha {
    background-color: #fff;
    background-image:
      linear-gradient(to top, transparent, var(--cp-alpha-color, #a855f7)),
      conic-gradient(rgba(0,0,0,.2) 0% 25%, transparent 0% 50%, rgba(0,0,0,.2) 0% 75%, transparent 0%);
    background-size: 100% 100%, 8px 8px;
  }
  .cp-hue-thumb, .cp-alpha-thumb {
    position: absolute;
    left: -2px; right: -2px;
    height: 4px;
    background: #fff;
    border: 1px solid rgba(0,0,0,.6);
    border-radius: 2px;
    transform: translateY(-50%);
    pointer-events: none;
    box-shadow: 0 0 4px rgba(0,0,0,.5);
  }
  .cp-preview-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 10px;
  }
  .cp-preview {
    width: 36px; height: 28px;
    border-radius: 4px;
    border: 1px solid rgba(var(--border), .1);
    background-color: #fff;
    background-image:
      linear-gradient(var(--cp-preview, #a855f7), var(--cp-preview, #a855f7)),
      conic-gradient(rgba(0,0,0,.2) 0% 25%, transparent 0% 50%, rgba(0,0,0,.2) 0% 75%, transparent 0%);
    background-size: 100% 100%, 8px 8px;
    flex-shrink: 0;
  }
  .cp-hex {
    flex: 1;
    padding: 5px 8px;
    font-size: 11px;
    font-family: var(--font-mono);
    background: rgba(var(--bg-3), .6);
    border: 1px solid rgba(var(--border), .08);
    border-radius: 4px;
    color: rgb(var(--text-1));
    text-transform: uppercase;
  }
  .cp-hex:focus { outline: none; border-color: rgba(var(--accent), .5); }
  .cp-rgba {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 8px;
  }
  .cp-rgba-cell {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .cp-rgba-cell label {
    font-size: 9px;
    font-weight: 600;
    color: rgb(var(--text-3));
    text-transform: uppercase;
  }
  .cp-rgba-cell input {
    width: 100%;
    padding: 3px 4px;
    font-size: 11px;
    font-family: var(--font-mono);
    background: rgba(var(--bg-3), .6);
    border: 1px solid rgba(var(--border), .08);
    border-radius: 4px;
    color: rgb(var(--text-1));
    text-align: center;
  }
  .cp-rgba-cell input:focus { outline: none; border-color: rgba(var(--accent), .5); }
  .cp-presets {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
    margin-top: 10px;
  }
  .cp-preset {
    aspect-ratio: 1;
    border-radius: 3px;
    border: 1.5px solid transparent;
    background: var(--c);
    transition: transform var(--t-fast) var(--ease);
  }
  .cp-preset:hover { transform: scale(1.18); border-color: rgba(255,255,255,.3); }

  /* ---------- Coords ---------- */
  .coords { display: grid; grid-template-columns: 1fr 1fr 1fr auto auto; gap: 10px; align-items: end; padding: 8px 0; }
  .coords label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: rgb(var(--text-3)); display: flex; flex-direction: column; gap: 5px; }

  /* ---------- Select ---------- */
  .select { position: relative; flex: 1; min-width: 140px; }
  .select::after { content: "▾"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: rgb(var(--accent-glow)); font-size: 10px; }
  .select select {
    appearance: none; -webkit-appearance: none;
    width: 100%;
    padding: 8px 32px 8px 14px;
    font-size: 12px; font-family: inherit;
    background: rgba(var(--bg-3), .6);
    border: 1px solid rgba(var(--border), var(--border-strength));
    border-radius: var(--radius-md);
    color: rgb(var(--text-1));
  }

  /* ---------- Toast ---------- */
  .toast-stack {
    position: fixed; top: 24px; right: 24px;
    display: flex; flex-direction: column; gap: 10px;
    z-index: 1000; pointer-events: none;
    max-width: 380px;
  }
  .toast {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px;
    background: rgba(var(--bg-2), .92);
    border: 1px solid rgba(var(--border), var(--border-strength));
    border-left: 3px solid rgb(var(--accent));
    border-radius: var(--radius-md);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,.4), 0 0 30px rgba(var(--accent), .15);
    pointer-events: auto;
    animation: slideIn var(--t-slow) var(--ease);
    min-width: 280px;
  }
  .toast.toast-out { animation: slideOut var(--t-med) var(--ease) forwards; }
  .toast-icon {
    width: 22px; height: 22px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: rgba(var(--accent), .15);
    color: rgb(var(--accent-glow));
    font-size: 11px; font-weight: 700;
    flex-shrink: 0; margin-top: 1px;
    box-shadow: 0 0 12px rgba(var(--accent), .35);
  }
  .toast-content { flex: 1; min-width: 0; }
  .toast-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .toast-msg { font-size: 12px; color: rgb(var(--text-2)); line-height: 1.4; }
  .toast-success { border-left-color: rgb(16, 185, 129); }
  .toast-success .toast-icon { background: rgba(16, 185, 129, .15); color: rgb(52, 211, 153); box-shadow: 0 0 12px rgba(16, 185, 129, .35); }
  .toast-warning { border-left-color: rgb(245, 158, 11); }
  .toast-warning .toast-icon { background: rgba(245, 158, 11, .15); color: rgb(251, 191, 36); box-shadow: 0 0 12px rgba(245, 158, 11, .35); }
  .toast-error { border-left-color: rgb(244, 63, 94); }
  .toast-error .toast-icon { background: rgba(244, 63, 94, .15); color: rgb(251, 113, 133); box-shadow: 0 0 12px rgba(244, 63, 94, .35); }
  @keyframes slideIn  { from { opacity: 0; transform: translateX(30px) scale(.95); } to { opacity: 1; transform: translateX(0) scale(1); } }
  @keyframes slideOut { to   { opacity: 0; transform: translateX(30px) scale(.95); } }

  /* ---------- Floating Panel (base for spectator / keybind list / anything Lua spawns) ---------- */
  .float-panel {
    position: fixed;
    min-width: 220px;
    max-width: 340px;
    background: rgba(var(--bg-2), .85);
    border: 1px solid rgba(var(--border), var(--border-strength));
    border-radius: var(--radius-md);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,.4), 0 0 24px rgba(var(--accent), .15);
    z-index: 50;
    overflow: hidden;
  }
  .float-panel.hidden { display: none; }
  .float-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(var(--border), var(--border-strength));
    background: linear-gradient(90deg, rgba(var(--accent), .12), transparent);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgb(var(--text-2));
  }
  .float-head .fh-dot {
    width: 6px; height: 6px;
    background: rgb(var(--accent));
    border-radius: 50%;
    box-shadow: 0 0 8px rgb(var(--accent));
  }
  .float-head .fh-title { flex: 1; }
  .float-body {
    padding: 8px 12px;
    max-height: 280px;
    overflow-y: auto;
  }
  .float-body::-webkit-scrollbar { width: 6px; }
  .float-body::-webkit-scrollbar-thumb { background: rgba(var(--accent), .25); border-radius: 3px; }

  /* Spectator + keybind list rows */
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 4px;
    border-bottom: 1px dashed rgba(var(--border), .04);
    font-size: 12px;
  }
  .row:last-child { border-bottom: none; }
  .row-name { flex: 1; color: rgb(var(--text-1)); }
  .row-id   { color: rgb(var(--text-3)); font-family: var(--font-mono); font-size: 11px; }
  .row-key  {
    padding: 2px 7px;
    font-size: 10px; font-family: var(--font-mono);
    background: rgba(var(--accent), .15); color: rgb(var(--accent-glow));
    border: 1px solid rgba(var(--accent), .3);
    border-radius: 4px;
  }
  .row-action { color: rgb(var(--text-2)); font-size: 11px; }
  .float-empty {
    padding: 14px 8px;
    text-align: center;
    color: rgb(var(--text-3));
    font-size: 11px;
  }

  .empty { padding: 40px 20px; text-align: center; color: rgb(var(--text-3)); font-size: 13px; }
</style>
</head>
<body>

<div class="neon-cursor" id="cursor"></div>

<!-- First-launch keybind picker -->
<div class="keybind-overlay" id="keybindOverlay" hidden>
  <div class="keybind-card">
    <div class="kb-mark"><i class="fa-solid fa-keyboard"></i></div>
    <h2>Pick your open/close key</h2>
    <p>Press the key you want to use to open and close Motion.lua, then press <b>Enter</b> to confirm.</p>
    <div class="keybind-display" id="kbDisplay">
      <span class="kb-blink"></span>
      <span id="kbDisplayText">Waiting for a key…</span>
    </div>
    <div class="keybind-hint" id="kbHint">Esc to cancel · Enter to save</div>
  </div>
</div>

<!-- Floating widgets (spectator / keybind list / custom) -->
<div id="floatLayer"></div>

<!-- Main UI -->
<div id="app" class="app" data-theme="dark" data-accent="violet">
  <div class="window" id="window">

    <aside class="sidebar">
      <div class="brand" data-drag-handle>
        <div class="brand-mark"><img src="https://raw.githubusercontent.com/MotionLua/motion-banners/refs/heads/main/theme5.png" alt="" /></div>
        <div class="brand-name">Motion<span class="dot">.</span>lua</div>
      </div>
      <nav class="nav" id="categoryNav"></nav>
      <div class="sidebar-footer">
        <div class="user">
          <div class="user-avatar" id="userAvatar"><img src="https://raw.githubusercontent.com/MotionLua/motion-banners/refs/heads/main/theme5.png" alt="" /></div>
          <div>
            <div class="user-name" id="userName">user</div>
            <div class="user-sub" id="userSub">connected</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="panel">
      <header class="panel-header" data-drag-handle>
        <div class="panel-title">
          <span class="pt-dot"></span>
          <span id="panelTitleText">Main Menu</span>
          <span class="pt-sub" id="panelSub">0 items</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="closeBtn" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </header>

      <div class="panel-body" id="panelBody"></div>
    </main>

  </div>
</div>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script>
/* =================================================================
   Motion.lua single-file UI
   Layers:
     1. Macho DUI bridge (window.message + fetch)
     2. Toast + Modal + Cursor + Window drag
     3. Keybind picker (first launch)  → opens main UI
     4. Floating panel primitive + Spectator + Keybind built-ins
     5. JSON menu engine (Lua-driven build)
   ================================================================= */
(function () {
  'use strict';

  /* ---------- 1) DUI bridge ---------- */
  const isFiveM = typeof window.GetParentResourceName === 'function';
  const listeners = new Map();

  async function post(event, data = {}) {
    try {
      const r = (typeof window.GetParentResourceName === 'function') ? window.GetParentResourceName() : 'any';
      const res = await fetch(`https://${r}/${event}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(data),
      });
      return await res.json().catch(() => null);
    } catch (e) { console.warn('[NUI] post failed', event, e); return null; }
  }
  function on(event, fn) {
    if (!listeners.has(event)) listeners.set(event, new Set());
    listeners.get(event).add(fn);
    return () => listeners.get(event)?.delete(fn);
  }
  window.addEventListener('message', (ev) => {
    const d = ev.data;
    if (!d || typeof d !== 'object') return;
    const name = d.action ?? d.type;
    if (!name) return;
    const set = listeners.get(name);
    if (set) for (const fn of set) {
      try { fn(d.payload ?? d, d); } catch (e) { console.error(e); }
    }
    const wild = listeners.get('*');
    if (wild) for (const fn of wild) {
      try { fn({ event: name, payload: d.payload ?? d }, d); } catch (e) { console.error(e); }
    }
  });
  window.Motion = { post, on };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
  }
  function emit(type, detail) {
    post(type, detail);
    window.dispatchEvent(new CustomEvent('motion:' + type.replace('ui:', ''), { detail }));
  }

  /* ---------- 2) Cursor ---------- */
  const cursor = document.getElementById('cursor');
  let lastHover = false;
  let cursorX = 0, cursorY = 0, cursorRaf = null;
  document.addEventListener('mousemove', (e) => {
    cursorX = e.clientX; cursorY = e.clientY;
    if (!cursorRaf) {
      cursorRaf = requestAnimationFrame(() => {
        cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) translate(-50%, -50%)`;
        cursorRaf = null;
      });
    }
    const isInteractive = !!e.target.closest('button, .item, input, select, [data-drag-handle], .nav-item, .scroll-btn, .slider, .switch, .section-head, .tab');
    if (isInteractive !== lastHover) { cursor.classList.toggle('hover', isInteractive); lastHover = isInteractive; }
  });
  document.addEventListener('mousedown', () => cursor.classList.add('click'));
  document.addEventListener('mouseup',   () => cursor.classList.remove('click'));

  /* ---------- 2b) Make any [data-drag-handle] container draggable ---------- */
  function makeDraggable(rootEl, handleSelector) {
    let dragging = false, startX = 0, startY = 0, originLeft = 0, originTop = 0;
    rootEl.addEventListener('mousedown', (e) => {
      const handle = e.target.closest(handleSelector);
      if (!handle || !rootEl.contains(handle)) return;
      if (e.target.closest('button, input, select, textarea, a')) return;
      if (e.button !== 0) return;
      const rect = rootEl.getBoundingClientRect();
      rootEl.style.transform = 'none';
      rootEl.style.left = rect.left + 'px';
      rootEl.style.top  = rect.top + 'px';
      originLeft = rect.left; originTop = rect.top;
      startX = e.clientX; startY = e.clientY;
      dragging = true;
    });
    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      const w = rootEl.offsetWidth, h = rootEl.offsetHeight;
      const maxL = window.innerWidth - w - 8;
      const maxT = window.innerHeight - h - 8;
      rootEl.style.left = Math.max(8, Math.min(maxL, originLeft + dx)) + 'px';
      rootEl.style.top  = Math.max(8, Math.min(maxT, originTop  + dy)) + 'px';
    });
    document.addEventListener('mouseup', () => { dragging = false; });
  }
  makeDraggable(document.getElementById('window'), '[data-drag-handle]');

  /* ---------- 2c) Toast ---------- */
  const stack = document.getElementById('toastStack');
  const Toast = {
    show({ level = 'info', title = '', message = '', duration = 3500 } = {}) {
      const el = document.createElement('div');
      el.className = `toast toast-${level}`;
      const icons = { info: 'i', success: '✓', warning: '!', error: '×' };
      el.innerHTML = `
        <div class="toast-icon">${icons[level] || 'i'}</div>
        <div class="toast-content">
          ${title ? '<div class="toast-title"></div>' : ''}
          ${message ? '<div class="toast-msg"></div>' : ''}
        </div>`;
      if (title) el.querySelector('.toast-title').textContent = title;
      if (message) el.querySelector('.toast-msg').textContent = message;
      stack.appendChild(el);
      const close = () => { el.classList.add('toast-out'); setTimeout(() => el.remove(), 220); };
      el.addEventListener('click', close);
      if (duration > 0) setTimeout(close, duration);
    },
  };
  window.Toast = Toast;
  on('ui:notify', (p) => Toast.show(p || {}));

  /* =================================================================
     3) Keybind picker (first launch)
     ================================================================= */
  const KEYBIND_STORAGE = 'motion.openKey';
  const overlay = document.getElementById('keybindOverlay');
  const kbDisplay = document.getElementById('kbDisplay');
  const kbText = document.getElementById('kbDisplayText');

  function readableKey(e) {
    if (e.code === 'Space') return 'Space';
    if (e.code === 'CapsLock') return 'CapsLock';
    if (e.key && e.key.length === 1) return e.key.toUpperCase();
    return e.key || e.code;
  }

  function saveKeybind(kb) {
    const tagged = { ...kb, version: 2 };
    try { localStorage.setItem(KEYBIND_STORAGE, JSON.stringify(tagged)); } catch {}
    emit('ui:keybindSet', tagged);
    try { rebuildKeybindList(); } catch {}
  }
  function loadKeybind() {
    try {
      const v = JSON.parse(localStorage.getItem(KEYBIND_STORAGE) || 'null');
      // Validate: must have a real code string AND be from current version
      if (!v || typeof v.code !== 'string' || !v.code) return null;
      if (v.version !== 2) {
        // Old saved keybind from before the picker had banned-key handling — wipe it
        try { localStorage.removeItem(KEYBIND_STORAGE); } catch {}
        return null;
      }
      return v;
    } catch { return null; }
  }
  function clearKeybind() {
    try { localStorage.removeItem(KEYBIND_STORAGE); } catch {}
  }

  let pendingKeyCaptured = null;
  let isFirstTimeSetup = false;
  function startKeybindPicker(opts = {}) {
    pendingKeyCaptured = null;
    isFirstTimeSetup = !!opts.firstTime;
    kbDisplay.classList.remove('captured');
    kbText.textContent = opts.message || 'Waiting for a key…';
    overlay.hidden = false;
  }
  function endKeybindPicker(saved) {
    overlay.hidden = true;
    if (saved && pendingKeyCaptured) {
      saveKeybind(pendingKeyCaptured);
      Toast.show({ level: 'success', title: 'Keybind saved', message: `Press ${pendingKeyCaptured.label} to toggle the menu` });
      // If this was first-time setup, open the main UI immediately so the user sees it
      if (isFirstTimeSetup) {
        document.getElementById('app').classList.add('open');
        emit('ui:open');
      }
    }
    pendingKeyCaptured = null;
    isFirstTimeSetup = false;
  }

  document.addEventListener('keydown', (e) => {
    // Keybind picker active
    if (!overlay.hidden) {
      e.stopImmediatePropagation();
      if (e.key === 'Escape') { endKeybindPicker(false); return; }
      if (e.key === 'Enter')  { if (pendingKeyCaptured) endKeybindPicker(true); return; }
      // Reject only keys with no useful keydown behavior as a toggle
      const banned = ['NumLock', 'ScrollLock', 'Meta', 'MetaLeft', 'MetaRight'];
      if (banned.includes(e.code) || banned.includes(e.key)) {
        kbText.textContent = `${readableKey(e)} can't be used — pick another`;
        e.preventDefault();
        return;
      }
      // Capture
      pendingKeyCaptured = { code: e.code, key: e.key, label: readableKey(e) };
      kbDisplay.classList.add('captured');
      kbText.textContent = pendingKeyCaptured.label + '  — press Enter to confirm';
      e.preventDefault();
      return;
    }

    // Item-level keybind capture (set via Menu.startCaptureFor)
    if (itemCaptureTarget) {
      e.preventDefault();
      if (e.key === 'Escape') { stopItemCapture(); return; }
      const captured = { code: e.code, key: e.key, label: readableKey(e) };
      itemKeybinds[itemCaptureTarget] = captured;
      saveItemKeybinds();
      emit('ui:itemKeybindSet', { id: itemCaptureTarget, key: captured });
      stopItemCapture();
      return;
    }

    // Main toggle key
    const kb = loadKeybind();
    if (kb && e.code === kb.code) {
      const app = document.getElementById('app');
      const isOpen = app.classList.toggle('open');
      emit(isOpen ? 'ui:open' : 'ui:close');
    }
    if (e.key === 'Escape') {
      const app = document.getElementById('app');
